# Środowisko deweloperskie: Grafana + InfluxDB 1.8 + Mailpit (+ opcjonalnie aplikacja).
#   npm run env:up     - start usług, dane testowe, konfiguracja Grafany, plik .env.dev
#   npm run env:app    - aplikacja w kontenerze (gnuplot w obrazie)
#   npm run env:down   - zatrzymanie i usunięcie danych
name: grafana-automation

services:
  influxdb:
    image: docker.io/library/influxdb:1.8.10
    environment:
      INFLUXDB_DB: metrics
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
      INFLUXDB_REPORTING_DISABLED: "true"
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb

  grafana:
    image: docker.io/grafana/grafana:12.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./dev/grafana/provisioning:/etc/grafana/provisioning:ro,z
      - grafana-data:/var/lib/grafana
    extra_hosts:
      # Webhook do aplikacji uruchomionej lokalnie (npm run dev:local)
      - "host.docker.internal:host-gateway"
    depends_on:
      - influxdb

  mailpit:
    image: docker.io/axllent/mailpit:v1.21.0
    ports:
      - "8025:8025" # UI i API: http://localhost:8025
      - "1025:1025" # SMTP

  app:
    profiles: ["app"]
    build: .
    env_file:
      - .env.dev
    environment:
      # Adresy usług w sieci compose (nadpisują wartości "localhost" z .env.dev)
      GRAFANA_URL: http://grafana:3000
      INFLUXDB_URL: http://influxdb:8086
      SMTP_HOST: mailpit
      MAILPIT_URL: http://mailpit:8025
      SELECTED_PLOTTER: gnuplot
      TZ: ${TZ:-Europe/Warsaw} # godziny na wykresach i w mailach
    ports:
      - "3001:3001"
    volumes:
      # Konfiguracja edytowalna bez przebudowy obrazu
      - ./dev:/app/dev:ro,z
      - ./templates:/app/templates:ro,z
      # Kolejka powiadomień (SQLite) - przetrwa przebudowę kontenera (npm run env:app); env:down ją kasuje
      - app-data:/app/data
    depends_on:
      - grafana
      - influxdb
      - mailpit

volumes:
  influxdb-data:
  grafana-data:
  app-data:
